<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Timer Eternal Dashboard</title>
    <!-- Bootstrap 5 CSS & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Kanit', sans-serif;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
        }
        .form-label {
            color: #ffffff !important;
            font-weight: 500;
        }
        .form-control, .form-select {
            background-color: #0f172a !important;
            border: 1px solid #334155;
            color: #ffffff !important;
        }
        .form-control::placeholder {
            color: #64748b;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a !important;
            color: #ffffff !important;
            border-color: #3b82f6;
            box-shadow: none;
        }
        .table {
            color: #f8fafc;
        }
        .table-dark {
            --bs-table-bg: #1e293b;
            --bs-table-hover-bg: #334155;
        }
        .status-badge {
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>⚔️ Boss Timer Dashboard (Eternal)</h2>
            <span class="badge bg-success status-badge">🟢 Web Online</span>
        </div>

        <!-- Form ภายในหน้าเดียว -->
        <div class="card p-4 mb-4 shadow-sm">
            <h4 class="card-title text-warning mb-3">⏱️ บันทึกเวลาบอสตาย</h4>
            <form id="bossForm" class="row g-3" autocomplete="off">
                <div class="col-md-4">
                    <label class="form-label">เลือก หรือ พิมพ์ชื่อบอส</label>
                    <input list="bossOptions" id="bossSelect" class="form-control" placeholder="พิมพ์เพื่อค้นหา หรือคลิกเลือก..." required autocomplete="off">
                    <datalist id="bossOptions">
                        <!-- สคริปต์จะดึงบอสทั้งหมดมาใส่ที่นี่ -->
                    </datalist>
                </div>
                <div class="col-md-3">
                    <label class="form-label">เวลาที่ตาย (ระบบ 24 ชม.)</label>
                    <input type="text" id="killTime" class="form-control" placeholder="เช่น 17:30 หรือ 1730" maxlength="5" autocomplete="off" enterkeyhint="done">
                    <small class="text-muted">*เว้นว่างไว้หากใช้เวลาปัจจุบัน</small>
                </div>
                <div class="col-md-3">
                    <label class="form-label">แจ้งเตือนล่วงหน้า (นาที)</label>
                    <input type="number" id="noticeMinutes" class="form-control" min="1" value="5">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100 fw-bold">⚔️ บันทึกเวลา</button>
                </div>
            </form>
        </div>

        <!-- ตารางแสดงผลเวลาบอส -->
        <div class="card p-4 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="card-title text-info mb-0">📜 ตารางเวลาบอสล่าสุด</h4>
                <button id="clearAllBtn" class="btn btn-outline-danger btn-sm">ล้างตารางทั้งหมด</button>
            </div>
            
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ชื่อบอส</th>
                            <th>เวลาตาย (เวลาไทย 24 ชม.)</th>
                            <th>เวลาเกิด (เวลาไทย 24 ชม.)</th>
                            <th>นับถอยหลัง</th>
                            <th>เตือนล่วงหน้า</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="bossTableBody">
                        <!-- แถวข้อมูลบอสจะถูกสร้างผ่าน JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="text-center text-muted mt-4">
            <small>ระบบคำนวณเวลานับถอยหลังบอส Real-time • ข้อมูลบันทึกในเบราว์เซอร์อัตโนมัติ</small>
        </footer>
    </div>

    <script>
        const BOSS_DATABASE = {
            "Wadangka": { cd: 9000, notice: 30 },
            "Elemental Queen": { cd: 9000, notice: 5 },
            "Tank": { cd: 3500, notice: 5 },
            "Swirl Flame": { cd: 3500, notice: 5 },
            "Maelstrom": { cd: 3500, notice: 5 },
            "Twister": { cd: 3500, notice: 5 },
            "Bigmama": { cd: 172800, notice: 30 },
            "Chief Magief": { cd: 1800, notice: 5 },
            "Faith": { cd: 21180, notice: 30 },
            "Apapa": { cd: 900, notice: 5 },
            "Corrupt Forest Keeper": { cd: 3480, notice: 5 },
            "Recluse": { cd: 40980, notice: 30 },
            "Blackskull": { cd: 3410, notice: 5 },
            "Sleepy Kooii": { cd: 1200, notice: 5 },
            "Awaken Kooii": { cd: 3780, notice: 5 },
            "Eeheehee": { cd: 4008, notice: 5 },
            "Ooheeheek": { cd: 4083, notice: 5 },
            "Oohehe": { cd: 3908, notice: 5 },
            "Guardian Imp": { cd: 3780, notice: 5 },
            "Devilang": { cd: 19980, notice: 30 },
            "Blackjuno": { cd: 2100, notice: 5 },
            "Blacksky": { cd: 2100, notice: 5 },
            "Red Fox": { cd: 1200, notice: 5 },
            "7tailfox": { cd: 1200, notice: 5 },
            "777Tailfox": { cd: 1800, notice: 5 },
            "Sunrise Flower": { cd: 1200, notice: 5 },
            "Magma Senior Thief": { cd: 1200, notice: 5 },
            "Bbinikjoe": { cd: 1200, notice: 5 },
            "Bigmouse": { cd: 1200, notice: 5 },
            "Caligo": { cd: 604800, notice: 60 },
            "Poison Root Flower": { cd: 1690, notice: 5 },
            "Contaminated Queen Bee": { cd: 1680, notice: 5 },
            "Rotten Pudding": { cd: 1800, notice: 5 },
            "Swamp Flower Monster": { cd: 1800, notice: 5 },
            "Ukpana": { cd: 172800, notice: 30 },
            "Darlene the Witch": { cd: 259200, notice: 30 },
            "Illust": { cd: 259200, notice: 30 },
            "Actaemon": { cd: 21600, notice: 30 },
            "Aiyo's Protector": { cd: 259200, notice: 30 },
            "Glucose": { cd: 1800, notice: 5 },
            "Overload": { cd: 1792, notice: 5 },
            "Soul Lich": { cd: 87300, notice: 30 },
            "Platanista": { cd: 604800, notice: 60 },
            "Barslaf": { cd: 172800, notice: 30 },
            "Billiard": { cd: 28503, notice: 5 },
            "Shaaack": { cd: 1800, notice: 5 },
            "Suuuk": { cd: 1200, notice: 5 },
            "Sususuk": { cd: 1200, notice: 5 },
            "sandgrave": { cd: 1200, notice: 5 },
            "Elder Beholder": { cd: 1200, notice: 5 }
        };

        function format24hBangkok(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return "00:00:00";
            
            const formatter = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Bangkok',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false,
                hourCycle: 'h23'
            });

            const parts = formatter.formatToParts(dateObj);
            let h = '00', m = '00', s = '00';

            for (const part of parts) {
                if (part.type === 'hour') h = part.value;
                if (part.type === 'minute') m = part.value;
                if (part.type === 'second') s = part.value;
            }

            if (h === '24') h = '00';
            return `${h}:${m}:${s}`;
        }

        let activeBosses = JSON.parse(localStorage.getItem('guild_boss_data') || '{}');

        const bossSelect = document.getElementById('bossSelect');
        const bossOptions = document.getElementById('bossOptions');
        const noticeInput = document.getElementById('noticeMinutes');
        const killTimeInput = document.getElementById('killTime');

        Object.keys(BOSS_DATABASE).forEach(bossName => {
            const option = document.createElement('option');
            option.value = bossName;
            bossOptions.appendChild(option);
        });

        bossSelect.addEventListener('input', (e) => {
            const selected = e.target.value.trim();
            if (BOSS_DATABASE[selected]) {
                noticeInput.value = BOSS_DATABASE[selected].notice;
            }
        });

        // ฟอร์แมตเวลาอัตโนมัติขณะพิมพ์ (รองรับทั้งพิมพ์เครื่องหมาย : เอง และพิมพ์เลขติดกัน 4 หลัก)
        killTimeInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^0-9:]/g, ''); // อนุญาตให้พิมพ์ตัวเลขและเครื่องหมาย :
            
            // ป้องกันการใส่เครื่องหมาย : ซ้ำซาก
            const parts = val.split(':');
            if (parts.length > 2) {
                val = parts[0] + ':' + parts.slice(1).join('');
            }
            
            // หากพิมพ์ตัวเลขติดกัน 4 หลักโดยไม่มี : จะจัดฟอร์แมตให้อัตโนมัติ (เช่น 1730 -> 17:30)
            if (!val.includes(':') && val.length === 4) {
                val = val.slice(0, 2) + ':' + val.slice(2, 4);
            }
            
            e.target.value = val;
        });

        document.getElementById('bossForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const bossName = bossSelect.value.trim();
            if (!bossName) return;

            const killTimeVal = killTimeInput.value.trim();
            const customNotice = parseInt(noticeInput.value) || 5;

            let killDate = new Date();
            if (killTimeVal) {
                let hh = 0, mm = 0;
                if (killTimeVal.includes(':')) {
                    const parts = killTimeVal.split(':');
                    hh = parseInt(parts[0], 10);
                    mm = parseInt(parts[1], 10);
                } else if (killTimeVal.length === 4) {
                    hh = parseInt(killTimeVal.slice(0, 2), 10);
                    mm = parseInt(killTimeVal.slice(2, 4), 10);
                }

                if (!isNaN(hh) && !isNaN(mm) && hh >= 0 && hh < 24 && mm >= 0 && mm < 60) {
                    killDate.setHours(hh, mm, 0, 0);
                    if (killDate > new Date()) {
                        killDate.setDate(killDate.getDate() - 1);
                    }
                } else {
                    alert('กรุณากรอกเวลาให้ถูกต้องตามระบบ 24 ชั่วโมง (เช่น 08:30 หรือ 17:45)');
                    return;
                }
            }

            const bossCd = BOSS_DATABASE[bossName] ? BOSS_DATABASE[bossName].cd : 0;
            const spawnTimeMs = killDate.getTime() + (bossCd * 1000);

            activeBosses[bossName] = {
                killTime: format24hBangkok(killDate),
                spawnTimeMs: spawnTimeMs,
                noticeMinutes: customNotice
            };

            saveAndRender();
            bossSelect.value = '';
            killTimeInput.value = '';
        });

        function deleteBoss(bossName) {
            delete activeBosses[bossName];
            saveAndRender();
        }

        document.getElementById('clearAllBtn').addEventListener('click', () => {
            if (confirm('คุณต้องการล้างตารางบอสทั้งหมดใช่หรือไม่?')) {
                activeBosses = {};
                saveAndRender();
            }
        });

        function saveAndRender() {
            localStorage.setItem('guild_boss_data', JSON.stringify(activeBosses));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('bossTableBody');
            tbody.innerHTML = '';

            const keys = Object.keys(activeBosses);
            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-white py-3 fw-normal">📌 ยังไม่มีการบันทึกเวลาบอสใดๆ ในระบบ</td></tr>`;
                return;
            }

            keys.sort((a, b) => activeBosses[a].spawnTimeMs - activeBosses[b].spawnTimeMs);

            const now = new Date().getTime();

            keys.forEach(bossName => {
                const data = activeBosses[bossName];
                const spawnDate = new Date(data.spawnTimeMs);
                const spawnTimeStr = format24hBangkok(spawnDate);
                
                const diffSec = Math.floor((data.spawnTimeMs - now) / 1000);
                
                let countdownStr = "";
                let badgeClass = "bg-primary";

                if (diffSec <= 0) {
                    countdownStr = "⚔️ เกิดแล้ว!";
                    badgeClass = "bg-danger";
                } else {
                    const h = Math.floor(diffSec / 3600);
                    const m = Math.floor((diffSec % 3600) / 60);
                    const s = diffSec % 60;
                    countdownStr = `⏳ ${h > 0 ? h + ' ชม. ' : ''}${m} นาที ${s} วินาที`;

                    if (diffSec <= (data.noticeMinutes * 60)) {
                        badgeClass = "bg-warning text-dark";
                    }
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold text-info">${bossName}</td>
                    <td>${data.killTime} น.</td>
                    <td>${spawnTimeStr} น.</td>
                    <td><span class="badge ${badgeClass}">${countdownStr}</span></td>
                    <td><small class="text-muted">${data.noticeMinutes} นาที</small></td>
                    <td><button onclick="deleteBoss('${bossName}')" class="btn btn-sm btn-outline-danger">ลบ</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        setInterval(renderTable, 1000);
        renderTable();
    </script>
</body>
</html>
