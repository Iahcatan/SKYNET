                        <option value="Asia/Hong_Kong">🇭🇰 Hong Kong, Beijing, Taipei (UTC+8)</option>
                        <option value="Asia/Tokyo">🇯🇵 Tokyo, Seoul (UTC+9)</option>
                        <option value="Europe/London">🇬🇧 London, Dublin (UTC+0/+1)</option>

                    </select>

            </div>
            <div>

        <!-- Form -->

                <div class="col-md-3">

                    <input type="text" id="killTime" class="form-control" placeholder="เช่น 17:30 หรือ 1730" data-i18n-ph="phKillTime" maxlength="5" autocomplete="off" enterkeyhint="done">

                footer: "Real-time Boss Countdown System • Synced with Cloud Database",
                invalidTimeAlert: "Please enter time in valid 24-hour format (e.g. 08:30 or 17:45)",

        let currentLang = localStorage.getItem('app_lang') || 'th';
        let currentTz = localStorage.getItem('app_tz') || 'auto';
        let activeBosses = {};

        const BOSS_DATABASE = {

            "Poison Root Flower": { cd: 1690, notice: 5 },
            "Contaminated Queen Bee": { cd: 1680, notice: 5 },
            "Rotten Pudding": { cd: 1800, notice: 5 },
            "Swamp Flower Monster": { cd: 1800, notice: 5 },
            "Ukpana": { cd: 172800, notice: 30 },
            "Darlene the Witch": { cd: 259200, notice: 30 },
            "Illust": { cd: 259200, notice: 30 },
            "Actaemon": { cd: 21600, notice: 30 },
            "Aiyo's Protector": { cd: 259200, notice: 30 },
            "Glucose": { cd: 1800, notice: 5 },

            "Shaaack": { cd: 1800, notice: 5 },
            "Suuuk": { cd: 1200, notice: 5 },
            "Sususuk": { cd: 1200, notice: 5 },
            "sandgrave": { cd: 1200, notice: 5 },
            "Elder Beholder": { cd: 1200, notice: 5 }
        };

        // --- 3. ระบบ Real-time Sync จาก Firebase ---
        bossRef.on('value', (snapshot) => {
            const rawData = snapshot.val() || {};
            activeBosses = {};
            
            Object.keys(rawData).forEach(bossName => {
                const item = rawData[bossName];
                let spawnMs = item.spawnTimeMs;
                if (!spawnMs && item.spawn_time) {
                    spawnMs = new Date(item.spawn_time).getTime();
                }
                const cdSec = BOSS_DATABASE[bossName] ? BOSS_DATABASE[bossName].cd : 0;
                let killMs = item.killTimeMs || (spawnMs - (cdSec * 1000));
                
                activeBosses[bossName] = {
                    spawnTimeMs: spawnMs,
                    killTimeMs: killMs,
                    noticeMinutes: item.noticeMinutes || (BOSS_DATABASE[bossName] ? BOSS_DATABASE[bossName].notice : 5),
                    notifiedNotice: item.notified_advance || item.notifiedNotice || false,
                    notifiedSpawn: item.notifiedSpawn || false
                };
            });
            renderTable();
        });

        // --- UI & Control Functions ---
        function applyLanguage() {
            const langData = TRANSLATIONS[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (langData[key]) el.innerText = langData[key];
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (langData[key]) el.placeholder = langData[key];
            });
            
            if ("Notification" in window && Notification.permission === "granted") {
                const notifyBtn = document.getElementById('notifyToggleBtn');
                notifyBtn.className = "btn btn-outline-success btn-sm fw-bold";
                notifyBtn.innerText = langData.notifyEnabled;
            }
            renderTable();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            applyLanguage();
        }

        function changeTimezone(tz) {
            currentTz = tz;
            localStorage.setItem('app_tz', tz);
            renderTable();
        }

        // --- Audio System (ปลดล็อกผ่าน User Interaction) ---
        let audioCtx = null;
        function playAlertSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'notice') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                    setTimeout(() => {
                        const osc2 = audioCtx.createOscillator();
                        const gain2 = audioCtx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(audioCtx.destination);
                        osc2.type = 'sine';
                        osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                        gain2.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        osc2.start();
                        osc2.stop(audioCtx.currentTime + 0.2);
                    }, 200);
                } else if (type === 'spawn') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // ✅ แก้ไขข้อ 5: เริ่มต้นใช้งานระบบแจ้งเตือนและ AudioContext เมื่อมีการตอบสนองจากผู้ใช้
        function initNotifications() {
            const langData = TRANSLATIONS[currentLang];
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        const notifyBtn = document.getElementById('notifyToggleBtn');
                        notifyBtn.className = "btn btn-outline-success btn-sm fw-bold";
                        notifyBtn.innerText = langData.notifyEnabled;
                        playAlertSound('notice');
                        new Notification(langData.notifyReadyTitle, { body: langData.notifyReadyBody });
                    } else {
                        alert(langData.grantNotifyPrompt);
                    }
                });
            } else {
                alert(langData.noNotifySupport);
            }
        }

        function sendBrowserNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body: body, requireInteraction: true });
            }
        }

        function format24h(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return "00:00:00";
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, hourCycle: 'h23' };
            if (currentTz && currentTz !== 'auto') options.timeZone = currentTz;

            const formatter = new Intl.DateTimeFormat('en-GB', options);
            const parts = formatter.formatToParts(dateObj);
            let h = '00', m = '00', s = '00';
            for (const part of parts) {
                if (part.type === 'hour') h = part.value;
                if (part.type === 'minute') m = part.value;
                if (part.type === 'second') s = part.value;
            }
            if (h === '24') h = '00';
            return `${h}:${m}:${s}`;
        }

        const bossSelect = document.getElementById('bossSelect');
        const bossOptions = document.getElementById('bossOptions');
        const noticeInput = document.getElementById('noticeMinutes');
        const killTimeInput = document.getElementById('killTime');

        Object.keys(BOSS_DATABASE).forEach(bossName => {
            const option = document.createElement('option');
            option.value = bossName;
            bossOptions.appendChild(option);
        });

        bossSelect.addEventListener('input', (e) => {
            const selected = e.target.value.trim();
            if (BOSS_DATABASE[selected]) {
                noticeInput.value = BOSS_DATABASE[selected].notice;
            }
        });

        killTimeInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^0-9:]/g, '');
            const parts = val.split(':');
            if (parts.length > 2) val = parts[0] + ':' + parts.slice(1).join('');
            if (!val.includes(':') && val.length === 4) val = val.slice(0, 2) + ':' + val.slice(2, 4);
            e.target.value = val;
        });

        // ✅ แก้ไขข้อ 5: คำนวณเวลา killDate ให้สอดคล้องกับ Timezone ที่เลือกบน Dashboard
        document.getElementById('bossForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const bossName = bossSelect.value.trim();
            if (!bossName) return;

            const killTimeVal = killTimeInput.value.trim();
            const customNotice = parseInt(noticeInput.value) || 5;

            let now = new Date();
            let killDate = new Date();

            if (killTimeVal) {
                let hh = 0, mm = 0;
                if (killTimeVal.includes(':')) {
                    const parts = killTimeVal.split(':');
                    hh = parseInt(parts[0], 10);
                    mm = parseInt(parts[1], 10);
                } else if (killTimeVal.length === 4) {
                    hh = parseInt(killTimeVal.slice(0, 2), 10);
                    mm = parseInt(killTimeVal.slice(2, 4), 10);
                }

                if (!isNaN(hh) && !isNaN(mm) && hh >= 0 && hh < 24 && mm >= 0 && mm < 60) {
                    const targetTz = (currentTz && currentTz !== 'auto') ? currentTz : Intl.DateTimeFormat().resolvedOptions().timeZone;
                    
                    // แปลงเวลาปัจจุบันให้ตรงกับ Timezone ที่ตั้งค่าไว้
                    const tzDateStr = new Intl.DateTimeFormat('en-US', {
                        timeZone: targetTz,
                        year: 'numeric', month: '2-digit', day: '2-digit'
                    }).format(now);

                    const [month, day, year] = tzDateStr.split('/');
                    const formattedHH = String(hh).padStart(2, '0');
                    const formattedMM = String(mm).padStart(2, '0');

                    // คำนวณ ISO String สำหรับ Timezone นั้นๆ
                    const tempDate = new Date(`${year}-${month}-${day}T${formattedHH}:${formattedMM}:00`);
                    
                    if (tempDate > now) {
                        tempDate.setDate(tempDate.getDate() - 1);
                    }
                    killDate = tempDate;
                } else {
                    alert(TRANSLATIONS[currentLang].invalidTimeAlert);
                    return;
                }
            }

            const bossCd = BOSS_DATABASE[bossName] ? BOSS_DATABASE[bossName].cd : 0;
            const spawnTimeMs = killDate.getTime() + (bossCd * 1000);
            const spawnDate = new Date(spawnTimeMs);

            bossRef.child(bossName).set({
                spawn_time: spawnDate.toISOString(),
                spawnTimeMs: spawnTimeMs,
                killTimeMs: killDate.getTime(),
                noticeMinutes: customNotice,
                notified_advance: false,
                notifiedNotice: false,
                notifiedSpawn: false
            });

            bossSelect.value = '';
            killTimeInput.value = '';
        });

        function deleteBoss(bossName) {
            bossRef.child(bossName).remove();
        }

        document.getElementById('clearAllBtn').addEventListener('click', () => {
            if (confirm(TRANSLATIONS[currentLang].confirmClear)) {
                bossRef.remove();
            }
        });

        function renderTable() {
            const tbody = document.getElementById('bossTableBody');
            tbody.innerHTML = '';
            const langData = TRANSLATIONS[currentLang];

            const keys = Object.keys(activeBosses);
            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-white py-3 fw-normal">${langData.emptyMsg}</td></tr>`;
                return;
            }

            keys.sort((a, b) => activeBosses[a].spawnTimeMs - activeBosses[b].spawnTimeMs);
            const now = new Date().getTime();

            keys.forEach(bossName => {
                const data = activeBosses[bossName];
                const spawnDate = new Date(data.spawnTimeMs);
                const killDate = new Date(data.killTimeMs);
                
                const killTimeStr = format24h(killDate);
                const spawnTimeStr = format24h(spawnDate);
                const diffSec = Math.floor((data.spawnTimeMs - now) / 1000);
                
                let countdownStr = "";
                let badgeClass = "bg-primary";

                if (diffSec <= 0) {
                    countdownStr = langData.spawned;
                    badgeClass = "bg-danger";

                    if (!data.notifiedSpawn) {
                        playAlertSound('spawn');
                        const notifyTitle = currentLang === 'th' ? `⚔️ บอส ${bossName} เกิดแล้ว!` : `⚔️ Boss ${bossName} Spawned!`;
                        const notifyBody = currentLang === 'th' ? `ถึงเวลาจัดการบอสแล้ว (${spawnTimeStr})` : `Time to fight! (${spawnTimeStr})`;
                        sendBrowserNotification(notifyTitle, notifyBody);
                        
                        bossRef.child(bossName).update({ notifiedSpawn: true });
                    }

                } else {
                    const h = Math.floor(diffSec / 3600);
                    const m = Math.floor((diffSec % 3600) / 60);
                    const s = diffSec % 60;
                    countdownStr = `⏳ ${h > 0 ? h + ' ' + langData.hourUnit + ' ' : ''}${m} ${langData.minUnit} ${s} ${langData.secUnit}`;

                    if (diffSec <= (data.noticeMinutes * 60)) {
                        badgeClass = "bg-warning text-dark";

                        if (!data.notifiedNotice) {
                            playAlertSound('notice');
                            const notifyTitle = currentLang === 'th' ? `⚠️ บอส ${bossName} ใกล้เกิดแล้ว!` : `⚠️ Boss ${bossName} Spawning Soon!`;
                            const notifyBody = currentLang === 'th' 
                                ? `จะเกิดภายในอีกประมาณ ${Math.ceil(diffSec / 60)} นาที (${spawnTimeStr})`
                                : `Spawning in approx. ${Math.ceil(diffSec / 60)} min(s) (${spawnTimeStr})`;
                            sendBrowserNotification(notifyTitle, notifyBody);
                            
                            bossRef.child(bossName).update({ notifiedNotice: true, notified_advance: true });
                        }
                    }
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold text-info">${bossName}</td>
                    <td>${killTimeStr} น.</td>
                    <td>${spawnTimeStr} น.</td>
                    <td><span class="badge ${badgeClass}">${countdownStr}</span></td>
                    <td>${data.noticeMinutes} ${langData.minUnit}</td>
                    <td>
                        <button class="btn btn-outline-danger btn-sm" onclick="deleteBoss('${bossName}')">${langData.btnDelete}</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // เริ่มต้นการแสดงผล
        document.getElementById('langSelect').value = currentLang;
        document.getElementById('tzSelect').value = currentTz;
        applyLanguage();

        // อัปเดตนับถอยหลังทุกๆ 1 วินาที
        setInterval(renderTable, 1000);
    </script>
</body>
</html>
